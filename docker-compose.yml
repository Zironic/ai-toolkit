services:
  ai-toolkit:
    image: ${AI_TOOLKIT_IMAGE:-zironic/ai-toolkit:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        SOURCE_REPO: ${SOURCE_REPO:-https://github.com/Zironic/ai-toolkit.git}
        SOURCE_REF: ${SOURCE_REF:-faster-dop}
        SOURCE_CREATED: ${SOURCE_CREATED:-unknown}
        ALLOW_PACKAGE_LOCK_MISMATCH: ${ALLOW_PACKAGE_LOCK_MISMATCH:-0}
    restart: unless-stopped
    ports:
      - "8675:8675"
    volumes:
      - ai-toolkit-workspace:/workspace
    environment:
      AI_TOOLKIT_AUTH: ${AI_TOOLKIT_AUTH:-}
      NODE_ENV: production
      TZ: ${TZ:-UTC}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ai-toolkit-workspace:
